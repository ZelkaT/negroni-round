name: Build firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build (Guition round display)
        run: pio run -e guition_round

      - name: Merge into a single flashable image
        run: |
          B=.pio/build/guition_round
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32c3 merge_bin \
            -o negroni-guition-round.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: negroni-guition-round
          path: negroni-guition-round.bin
