; Original generic ESP32 build (no screen)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Libraries needed for the captive portal
lib_deps =
    DNSServer
    WebServer
    WiFi

; Guition ESP32-2424S012: ESP32-C3 + 1.28" round GC9A01 (240x240)
[env:guition_round]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DUSE_ROUND_LCD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
